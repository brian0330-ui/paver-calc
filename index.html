    .flatbed-track { flex: 1; height: 13px; background: rgba(255,255,255,.15); border-radius: 7px; overflow: hidden; }

    .flatbed-pct { font-size: 11px; font-weight: 700; width: 34px; text-align: right; flex-shrink: 0; }

</head>

// state[rowId] = { paverKey, source, sf, pallets, layers }
// customRows[`${cat}|${mfr}`] = [rowId, ...]  (extra rows added via + button)
const state = {};         // rowId -> { paverKey, source, sf, pallets, layers }
let rowCounter = 0;

function mkRowId() { return `row_${rowCounter++}`; }

// Group key -> array of extra row ids (beyond the default paver rows)
const extraRows = {};   // `${cat}|${mfr}` -> [rowId, ...]

function groupKey(cat, mfr) { return `${cat}|${mfr}`; }

// ── Calc ─────────────────────────────────────────────────────────────────────
function getPaver(paverKey) { return paverData.find(p => p.cat+'|'+p.mfr+'|'+p.name === paverKey); }

function sfToOrder(p, sf) {
  const totalLayers = Math.ceil(sf / p.sqftLayer);
  const fullPallets = Math.floor(totalLayers / p.layersPallet);
  const remLayers   = totalLayers % p.layersPallet;
  const palletsNeeded = fullPallets + (remLayers > 0 ? 1 : 0);
  return { totalLayers, fullPallets, remLayers, palletsNeeded, sfCovered: totalLayers * p.sqftLayer };
}

function orderToSf(p, pallets, layers) {
  return (pallets * p.layersPallet + layers) * p.sqftLayer;
}

  if (s.source === 'sf' && s.sf > 0) return sfToOrder(p, s.sf);
  if (s.source === 'order') {
    const sf = orderToSf(p, s.pallets||0, s.layers||0);
    if (sf > 0) return sfToOrder(p, sf);
  }
  return null;
}

// ── Render helpers ────────────────────────────────────────────────────────────
function resultHtml(s, c) {
  const r = getResult(s);
  if (!r) return `<span class="no-result">Enter square feet, pallets, or layers</span>`;
  const { fullPallets, remLayers, totalLayers, sfCovered, palletsNeeded } = r;
  let h = `<div class="result-wrap">`;
  if (fullPallets > 0)
    h += `<span class="badge" style="background:${c.bg}">${fullPallets} pallet${fullPallets!==1?'s':''}</span>`;
  if (remLayers > 0)
    h += `<span class="badge" style="background:${c.acc}">${remLayers} layer${remLayers!==1?'s':''} extra</span>`;
  if (fullPallets===0 && remLayers===0 && totalLayers>0)
    h += `<span class="badge" style="background:${c.bg}">1 pallet</span>`;
  h += `<div class="result-sub">${totalLayers} total layers &nbsp;·&nbsp; ~${sfCovered.toFixed(1)} SF covered &nbsp;·&nbsp; ${palletsNeeded} pallet${palletsNeeded!==1?'s':''} needed</div>`;
  h += `</div>`;
  return h;
}

function cardHtml(rowId, cat, mfr, fixedPaver) {
  // fixedPaver: paverData object if this is a standard row; null if custom (dropdown)
  const c = MFR_COLORS[mfr] || {bg:'#333', acc:'#aaa'};
  const s = state[rowId] || {};
  const p = fixedPaver || getPaver(s.paverKey);

  let topHtml = '';
  if (fixedPaver) {
    topHtml = `<div class="card-header-row"><span class="paver-name">${fixedPaver.name}</span></div>`;
  } else {
    // Build options for this cat+mfr
    const opts = paverData.filter(x => x.cat===cat && x.mfr===mfr)
      .map(x => {
        const pk = x.cat+'|'+x.mfr+'|'+x.name;
        const sel = s.paverKey === pk ? 'selected' : '';
        return `<option value="${pk}" ${sel}>${x.name}</option>`;
      }).join('');
    topHtml = `
      <div class="card-header-row">
        <span class="paver-name">Additional Row</span>
        <button class="remove-card-btn" data-remove="${rowId}" title="Remove">✕</button>
      </div>
      <select class="paver-select" data-rowid="${rowId}" data-select="paver">
        <option value="">— Select a paver —</option>
        ${opts}
      </select>`;
  }

  // Spec pills
  let specHtml = '';
  if (p) {
    specHtml = `<div class="card-specs">
      <span class="spec-pill">${p.sqftPallet} SF/plt</span>
      <span class="spec-pill">${p.sqftLayer} SF/layer</span>
      <span class="spec-pill">${p.layersPallet} layers/plt</span>
      <span class="spec-pill">${p.piecesLayer} pcs/layer</span>
    </div>`;
  }

  // Input values
  const sfVal    = s.sf     != null ? s.sf     : '';
  const pltVal   = s.pallets!= null ? s.pallets : '';
  const lyrVal   = s.layers != null ? s.layers  : '';
  const sfDerived  = s.source==='order' ? ' derived' : '';
  const pltDerived = s.source==='sf'    ? ' derived' : '';
  const lyrDerived = s.source==='sf'    ? ' derived' : '';

  // Derived display
  let dispSf=sfVal, dispPlt=pltVal, dispLyr=lyrVal;
  const r = getResult(s);
  if (r) {
    if (s.source==='sf') {
      dispPlt = r.fullPallets > 0 ? r.fullPallets : '';
      dispLyr = r.remLayers  > 0 ? r.remLayers  : '';
    } else if (s.source==='order') {
      dispSf = p ? orderToSf(p, s.pallets||0, s.layers||0).toFixed(1) : '';
    }
  }

  const inputsDisabled = (!p) ? 'disabled' : '';

  return `<div class="paver-card${s.source?' active':''}" data-rowid="${rowId}">
    ${topHtml}
    ${specHtml}
    <div class="inputs-row">
      <div class="input-group">
        <span class="input-lbl">Square Feet</span>
        <input class="calc-input${sfDerived}" type="number" inputmode="decimal" min="0"
          placeholder="0" value="${dispSf}" data-rowid="${rowId}" data-field="sf" ${inputsDisabled}/>
        <span class="input-unit">SF</span>
      </div>
      <span class="inputs-divider">⇄</span>
      <div class="input-group">
        <span class="input-lbl">Pallets</span>
        <input class="calc-input${pltDerived}" type="number" inputmode="decimal" min="0"
          placeholder="0" value="${dispPlt}" data-rowid="${rowId}" data-field="pallets" ${inputsDisabled}/>
        <span class="input-unit">full pallets</span>
      </div>
      <div class="input-group">
        <span class="input-lbl">+ Layers</span>
        <input class="calc-input${lyrDerived}" type="number" inputmode="decimal" min="0"
          placeholder="0" value="${dispLyr}" data-rowid="${rowId}" data-field="layers" ${inputsDisabled}/>
        <span class="input-unit">extra layers</span>
      </div>
    </div>
    <div class="result-area">${resultHtml(s, c)}</div>
  </div>`;
}

// ── Full render ───────────────────────────────────────────────────────────────
let currentCat = 'ALL', currentSearch = '';

// rowId maps for standard (fixed) rows: paverKey -> rowId
const fixedRowIds = {};  // paverKey -> rowId  (created once, stable)

function ensureFixedRowIds() {
  for (const p of paverData) {
    const pk = p.cat+'|'+p.mfr+'|'+p.name;
    if (!fixedRowIds[pk]) {
      const rid = mkRowId();
      fixedRowIds[pk] = rid;
      state[rid] = { paverKey: pk, source: null, sf: 0, pallets: 0, layers: 0 };
    }
  }
}

function render() {
  ensureFixedRowIds();
  const q = currentSearch.toLowerCase();
  const filtered = paverData.filter(p => {
    const catOk = currentCat==='ALL' || p.cat===currentCat;
    const searchOk = !q || p.name.toLowerCase().includes(q) || p.mfr.toLowerCase().includes(q);
    return catOk && searchOk;
  });

  const groups = {};
  for (const p of filtered) {
    if (!groups[p.cat]) groups[p.cat]={};
    if (!groups[p.cat][p.mfr]) groups[p.cat][p.mfr]=[];
    groups[p.cat][p.mfr].push(p);
  }

  const root = document.getElementById('paver-list-root');
  const emptyMsg = document.getElementById('empty-msg');
  const hint = document.getElementById('search-hint');

  if (filtered.length===0) { root.innerHTML=''; emptyMsg.style.display='block'; hint.style.display='none'; return; }
  emptyMsg.style.display='none';
  hint.style.display = q ? 'block' : 'none';
  hint.textContent = `${filtered.length} result${filtered.length!==1?'s':''} — tap a row to enter values`;

  let html = '';
  for (const [cat, mfrs] of Object.entries(groups)) {
    html += `<div class="cat-label">${cat==='PAVER'?'⬛':'🧱'} ${cat}</div>`;
    for (const [mfr, pavers] of Object.entries(mfrs)) {
      const c = MFR_COLORS[mfr]||{bg:'#333',acc:'#aaa'};
      const gk = groupKey(cat, mfr);
      html += `<div class="mfr-block" data-gk="${gk}">
        <div class="mfr-header" style="background:${c.bg}">
          <span class="mfr-name" style="color:${c.acc}">${mfr.toUpperCase()}</span>
          <button class="add-row-btn" data-cat="${cat}" data-mfr="${mfr}" data-acc="${c.acc}">
            <span style="font-size:15px;line-height:1">+</span> Add Row
          </button>
        </div>
        <div class="paver-list" data-gk="${gk}">`;

      // Standard rows
      for (const p of pavers) {
        const pk = p.cat+'|'+p.mfr+'|'+p.name;
        const rid = fixedRowIds[pk];
        html += cardHtml(rid, cat, mfr, p);
      }

      // Extra rows for this group
      const extras = extraRows[gk] || [];
      for (const rid of extras) {
        html += cardHtml(rid, cat, mfr, null);
      }

      html += `</div></div>`;
    }
  }
  root.innerHTML = html;
}

// ── Partial card refresh ──────────────────────────────────────────────────────
function refreshCard(rowId) {
  const el = document.querySelector(`.paver-card[data-rowid="${rowId}"]`);
  if (!el) return;
  const s = state[rowId];
  if (!s) return;
  const p = getPaver(s.paverKey);
  const c = p ? (MFR_COLORS[p.mfr]||{bg:'#333',acc:'#aaa'}) : {bg:'#333',acc:'#aaa'};
  const r = getResult(s);
  const isActive = !!(s.source);
  el.classList.toggle('active', isActive);

  // Update spec pills if paver just selected
  const specEl = el.querySelector('.card-specs');
  if (specEl && p) {
    specEl.innerHTML = `
      <span class="spec-pill">${p.sqftPallet} SF/plt</span>
      <span class="spec-pill">${p.sqftLayer} SF/layer</span>
      <span class="spec-pill">${p.layersPallet} layers/plt</span>
      <span class="spec-pill">${p.piecesLayer} pcs/layer</span>`;
  } else if (!p && specEl) {
    specEl.innerHTML = '';
  }

  // Enable inputs if paver selected
  el.querySelectorAll('.calc-input').forEach(inp => inp.disabled = !p);

  const sfInput  = el.querySelector('[data-field="sf"]');
  const pltInput = el.querySelector('[data-field="pallets"]');
  const lyrInput = el.querySelector('[data-field="layers"]');

  if (sfInput && pltInput && lyrInput) {
    if (s.source==='sf' && r) {
      pltInput.value = r.fullPallets > 0 ? r.fullPallets : '';
      lyrInput.value = r.remLayers  > 0 ? r.remLayers  : '';
      pltInput.classList.add('derived'); lyrInput.classList.add('derived');
      sfInput.classList.remove('derived');
    } else if (s.source==='order' && r && p) {
      sfInput.value = orderToSf(p, s.pallets||0, s.layers||0).toFixed(1);
      sfInput.classList.add('derived');
      pltInput.classList.remove('derived'); lyrInput.classList.remove('derived');
    } else {
      sfInput.classList.remove('derived'); pltInput.classList.remove('derived'); lyrInput.classList.remove('derived');
    }
  }

  el.querySelector('.result-area').innerHTML = resultHtml(s, c);
}

// ── Input handler ─────────────────────────────────────────────────────────────
document.getElementById('main').addEventListener('input', e => {
  // Paver select (custom rows)
  if (e.target.dataset.select === 'paver') {
    const rowId = e.target.dataset.rowid;
    if (!state[rowId]) state[rowId] = { paverKey: null, source: null, sf: 0, pallets: 0, layers: 0 };
    state[rowId].paverKey = e.target.value || null;
    state[rowId].source = null; state[rowId].sf=0; state[rowId].pallets=0; state[rowId].layers=0;
    refreshCard(rowId);
    updateBanner(); updateClearBtn();
    return;
  }

  if (!e.target.classList.contains('calc-input')) return;
  const rowId = e.target.dataset.rowid;
  const field  = e.target.dataset.field;
  const val    = parseFloat(e.target.value);
  const num    = isNaN(val) || val < 0 ? 0 : val;

  if (!state[rowId]) state[rowId] = { paverKey: null, source: null, sf: 0, pallets: 0, layers: 0 };
  const s = state[rowId];

  if (field==='sf') {
    s.sf = num; s.source = num>0 ? 'sf' : null;
    if (!s.source) { s.pallets=0; s.layers=0; }
  } else {
    s[field] = num;
    s.source = (s.pallets>0||s.layers>0) ? 'order' : null;
    if (!s.source) s.sf=0;
  }

  refreshCard(rowId);
  updateBanner(); updateClearBtn();
});

// ── Add row button ─────────────────────────────────────────────────────────────
document.getElementById('main').addEventListener('click', e => {
  // Add row
  const addBtn = e.target.closest('.add-row-btn');
  if (addBtn) {
    const cat = addBtn.dataset.cat;
    const mfr = addBtn.dataset.mfr;
    const gk  = groupKey(cat, mfr);
    const rid = mkRowId();
    state[rid] = { paverKey: null, source: null, sf: 0, pallets: 0, layers: 0 };
    if (!extraRows[gk]) extraRows[gk] = [];
    extraRows[gk].push(rid);

    // Insert card HTML into the paver-list div
    const listEl = document.querySelector(`.paver-list[data-gk="${gk}"]`);
    if (listEl) {
      const div = document.createElement('div');
      div.innerHTML = cardHtml(rid, cat, mfr, null);
      listEl.appendChild(div.firstChild);
    }
    return;
  }

  // Remove row
  const removeBtn = e.target.closest('.remove-card-btn');
  if (removeBtn) {
    const rid = removeBtn.dataset.remove;
    // Remove from extraRows
    for (const gk of Object.keys(extraRows)) {
      extraRows[gk] = extraRows[gk].filter(r => r !== rid);
    }
    delete state[rid];
    const cardEl = document.querySelector(`.paver-card[data-rowid="${rid}"]`);
    if (cardEl) cardEl.remove();
    updateBanner(); updateClearBtn();
    return;
  }
});

// ── Banner ────────────────────────────────────────────────────────────────────
function updateBanner() {
  let totalPallets = 0;
  const lines = [];
  for (const [rowId, s] of Object.entries(state)) {
    if (!s || !s.source || !s.paverKey) continue;
    const r = getResult(s);
    if (!r) continue;
    const p = getPaver(s.paverKey);
    totalPallets += r.palletsNeeded;
    lines.push({ name: p ? p.name : 'Unknown', pallets: r.palletsNeeded });
  }

  const banner = document.getElementById('flatbed-banner');
  if (totalPallets===0) { banner.style.display='none'; return; }

  const flatbeds = Math.ceil(totalPallets/FLATBED_MAX);
  const rem = totalPallets % FLATBED_MAX;
  const isLarge = totalPallets >= 12;

  const bannerBg  = totalPallets>=FLATBED_MAX ? '#7f1d1d' : totalPallets>=12 ? '#78350f' : '#14532d';
  const bannerAcc = totalPallets>=FLATBED_MAX ? '#fca5a5' : totalPallets>=12 ? '#fcd34d' : '#86efac';

  banner.style.display='block';
  banner.style.background=bannerBg;
  banner.style.borderColor=bannerAcc;
  document.getElementById('banner-title').style.color=bannerAcc;
  document.getElementById('banner-title').textContent=`${totalPallets} total pallet${totalPallets!==1?'s':''} across all items`;

  const subEl=document.getElementById('banner-sub');
  if (isLarge) {
    subEl.textContent=`${flatbeds} flatbed${flatbeds!==1?'s':''} needed`+(rem>0?` — ${FLATBED_MAX-rem} pallet${FLATBED_MAX-rem!==1?'s':''} of space left on last trailer`:" — trailers fully loaded");
  } else {
    subEl.textContent=`${FLATBED_MAX-totalPallets} more pallet${FLATBED_MAX-totalPallets!==1?'s':''} until a flatbed is needed`;
  }

  document.getElementById('banner-chips').innerHTML = lines.length>1
    ? lines.map(l=>`<span class="banner-chip">${l.name}: ${l.pallets} plt</span>`).join('') : '';

  const vizEl=document.getElementById('flatbed-viz');
  if (totalPallets>=FLATBED_MAX) {
    let vhtml='';
    for (let i=0;i<flatbeds;i++) {
      const isLast=i===flatbeds-1;
      const on=isLast&&rem>0?rem:FLATBED_MAX;
      const pct=Math.round(on/FLATBED_MAX*100);
      vhtml+=`<div class="flatbed-row"><span class="flatbed-lbl">Trailer ${i+1}</span><div class="flatbed-track"><div class="flatbed-fill" style="width:${pct}%;background:${bannerAcc}"></div></div><span class="flatbed-pct" style="color:${bannerAcc}">${on}/${FLATBED_MAX}</span></div>`;
    }
    vizEl.innerHTML=vhtml; vizEl.style.display='flex';
  } else { vizEl.style.display='none'; }
}

function updateClearBtn() {
  const count = Object.values(state).filter(s=>s&&s.source).length;
  const btn=document.getElementById('clear-btn');
  btn.style.display=count>0?'block':'none';
  btn.textContent=`Clear all (${count})`;
}

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input',e=>{
  currentSearch=e.target.value;
  document.getElementById('clear-search').style.display=currentSearch?'block':'none';
  render();
});
document.getElementById('clear-search').addEventListener('click',()=>{
  document.getElementById('search-input').value=''; currentSearch='';
  document.getElementById('clear-search').style.display='none'; render();
});
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); currentCat=btn.dataset.cat; render();
  });
});
document.getElementById('clear-btn').addEventListener('click',()=>{
  Object.keys(state).forEach(k=>{ if(state[k]) { state[k].source=null; state[k].sf=0; state[k].pallets=0; state[k].layers=0; }});
  Object.keys(extraRows).forEach(k=>{ extraRows[k]=[]; });
  currentSearch=''; document.getElementById('search-input').value='';
  document.getElementById('clear-search').style.display='none';
  render(); updateBanner(); updateClearBtn();
});

// PWA install
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install-bar').style.display='flex';});
document.getElementById('install-btn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install-bar').style.display='none';});
document.getElementById('dismiss-install').addEventListener('click',()=>document.getElementById('install-bar').style.display='none');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
</script>
</body>
</html>
