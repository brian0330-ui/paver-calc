<html lang="en">

  <meta name="apple-mobile-web-app-title" content="Paver Calc" />
  <meta name="description" content="Paver & Wall pallet/layer calculator" />

    h1 { font-size: 19px; font-weight: 800; letter-spacing: -.5px; }

    .search-wrap { position: relative; flex: 1; min-width: 150px; }
    .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 15px; color: #888; pointer-events: none; }
    #search-input { width: 100%; padding: 9px 30px 9px 30px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 15px; outline: none; }
    #clear-search { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #888; font-size: 14px; cursor: pointer; padding: 4px; }
    .tabs { display: flex; gap: 5px; flex-shrink: 0; }
    .tab-btn { padding: 7px 11px; border-radius: 6px; border: 1px solid #444; background: transparent; color: #aaa; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--gold); border-color: var(--gold); color: var(--dark); }
    #search-hint { margin-top: 6px; font-size: 11px; color: #888; display: none; }

    /* FLATBED BANNER */
    #banner-zone { max-width: 900px; margin: 0 auto; padding: 14px 14px 0; }
    #flatbed-banner { display: none; border-radius: 12px; border: 1.5px solid; padding: 14px 16px; margin-bottom: 4px; }
    .banner-top { display: flex; align-items: flex-start; gap: 12px; }
    .banner-icon { font-size: 24px; line-height: 1; flex-shrink: 0; }
    .banner-title { font-weight: 800; font-size: 15px; margin-bottom: 3px; }
    .banner-sub { color: #e5e7eb; font-size: 13px; }
    .banner-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .banner-chip { background: rgba(255,255,255,.12); color: #e5e7eb; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
    .flatbed-viz { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
    .flatbed-row { display: flex; align-items: center; gap: 8px; }
    .flatbed-lbl { color: #e5e7eb; font-size: 11px; font-weight: 600; width: 66px; flex-shrink: 0; }
    .flatbed-track { flex: 1; height: 13px; background: rgba(255,255,255,.15); border-radius: 7px; overflow: hidden; }
    .flatbed-fill { height: 100%; border-radius: 7px; transition: width .3s; }
    .flatbed-pct { font-size: 11px; font-weight: 700; width: 34px; text-align: right; flex-shrink: 0; }

    /* MAIN */

    #empty-msg { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; display: none; }

    .mfr-name { font-weight: 700; font-size: 12px; letter-spacing: 1px; }
    .paver-list { background: var(--card); }

    .input-group { display: flex; flex-direction: column; gap: 3px; }
    .input-lbl { font-size: 10px; font-weight: 700; color: #999; letter-spacing: .5px; text-transform: uppercase; }
    .calc-input {

    .inputs-divider { font-size: 18px; color: #ccc; padding-bottom: 10px; }

    /* RESULT */
    .result-area { min-height: 22px; }
    .result-wrap { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; color: #fff; white-space: nowrap; }
    .result-sub { font-size: 11px; color: #888; }
    .no-result { color: #ddd; font-size: 14px; }

</head>

const MFR_COLORS = {
  "Belgard":    {bg:"#1a3a5c", acc:"#e8a838"},
  "Techo-Bloc": {bg:"#1a4a3a", acc:"#5dbe8a"},
  "Tremron":    {bg:"#5c1a1a", acc:"#e05c2a"},
  "Unilock":    {bg:"#2a1a5c", acc:"#9b7fe8"},
  "NicoLock":   {bg:"#3a2a0a", acc:"#d4a843"},
};

// State: { key -> {sf, pallets, layers} }  — only one field is "source" at a time
const state = {};
const sqftValues = {}; // for banner (total pallets)

function key(p) { return `${p.cat}|${p.mfr}|${p.name}`; }

// ── Calculation engine ───────────────────────────────────────────────────────
// From SF  → pallets + extra layers
function sfToOrder(p, sf) {
  const totalLayers = Math.ceil(sf / p.sqftLayer);
  const fullPallets = Math.floor(totalLayers / p.layersPallet);
  const remLayers   = totalLayers % p.layersPallet;
  const palletsNeeded = fullPallets + (remLayers > 0 ? 1 : 0);
  return { totalLayers, fullPallets, remLayers, palletsNeeded, sfCovered: totalLayers * p.sqftLayer };
}

// From pallets + layers → SF covered
function orderToSf(p, pallets, layers) {
  const totalLayers = pallets * p.layersPallet + layers;
  return totalLayers * p.sqftLayer;
}

// ── Render helpers ───────────────────────────────────────────────────────────
function resultHtml(p, c, r) {
  if (!r) return `<span class="no-result">Enter SF, pallets, or layers above</span>`;
  const { fullPallets, remLayers, totalLayers, sfCovered, palletsNeeded } = r;
  let h = `<div class="result-wrap">`;
  if (fullPallets > 0)
    h += `<span class="badge" style="background:${c.bg}">${fullPallets} pallet${fullPallets!==1?"s":""}</span>`;
  if (remLayers > 0)
    h += `<span class="badge" style="background:${c.acc}">${remLayers} layer${remLayers!==1?"s":""} extra</span>`;
  if (fullPallets===0 && remLayers===0 && totalLayers>0)
    h += `<span class="badge" style="background:${c.bg}">1 pallet</span>`;
  h += `<span class="result-sub">${totalLayers} layers · ~${sfCovered.toFixed(1)} SF · ${palletsNeeded} plt total</span>`;
  h += `</div>`;
  return h;
}

function cardHtml(p) {
  const k = key(p);
  const c = MFR_COLORS[p.mfr] || {bg:"#333", acc:"#aaa"};
  const s = state[k] || {};
  const sfVal = s.sf != null ? s.sf : "";
  const pltVal = s.pallets != null ? s.pallets : "";
  const lyrVal = s.layers != null ? s.layers : "";
  const isActive = sfVal !== "" || pltVal !== "" || lyrVal !== "";

  // Compute result from whichever field is source
  let r = null;
  if (s.source === "sf" && s.sf > 0) r = sfToOrder(p, s.sf);
  else if (s.source === "order" && (s.pallets > 0 || s.layers > 0)) {
    const sf = orderToSf(p, s.pallets||0, s.layers||0);
    r = sfToOrder(p, sf);
  }

  // Derived display values
  let dispSf = sfVal, dispPlt = pltVal, dispLyr = lyrVal;
  if (r) {
    if (s.source === "sf") {
      dispPlt = r.fullPallets > 0 ? r.fullPallets : "";
      dispLyr = r.remLayers > 0 ? r.remLayers : "";
    } else if (s.source === "order") {
      dispSf = orderToSf(p, s.pallets||0, s.layers||0).toFixed(1);
    }
  }

  const pltDerived = s.source === "sf" ? " derived" : "";
  const lyrDerived = s.source === "sf" ? " derived" : "";

  const specPills = [
    `${p.sqftPallet} SF/plt`,
    `${p.sqftLayer} SF/layer`,
    `${p.layersPallet} layers/plt`,
    `${p.piecesLayer} pcs/layer`,
  ].map(s=>`<span class="spec-pill">${s}</span>`).join("");

  return `<div class="paver-card${isActive?" active":""}" data-key="${k}">
    <div class="paver-name">${p.name}</div>
    <div class="card-specs">${specPills}</div>
    <div class="inputs-row">
      <div class="input-group">
        <span class="input-lbl">Square Feet</span>
        <input class="calc-input${sfDerived}" type="number" inputmode="decimal" min="0"
          placeholder="0" value="${dispSf}" data-key="${k}" data-field="sf" />
        <span class="input-unit">SF</span>
      </div>
      <span class="inputs-divider">⇄</span>
      <div class="input-group">
        <span class="input-lbl">Pallets</span>
        <input class="calc-input${pltDerived}" type="number" inputmode="decimal" min="0"
          placeholder="0" value="${dispPlt}" data-key="${k}" data-field="pallets" />
        <span class="input-unit">full pallets</span>
      </div>
      <div class="input-group">
        <span class="input-lbl">+ Layers</span>
        <input class="calc-input${lyrDerived}" type="number" inputmode="decimal" min="0"
          placeholder="0" value="${dispLyr}" data-key="${k}" data-field="layers" />
        <span class="input-unit">extra layers</span>
      </div>
    </div>
    <div class="result-area">${resultHtml(p, c, r)}</div>
  </div>`;
}

// ── Full render ──────────────────────────────────────────────────────────────
let currentCat = "ALL", currentSearch = "";

function render() {
  const q = currentSearch.toLowerCase();
  const filtered = paverData.filter(p => {
    const catOk = currentCat==="ALL" || p.cat===currentCat;
    const searchOk = !q || p.name.toLowerCase().includes(q) || p.mfr.toLowerCase().includes(q);
    return catOk && searchOk;
  });

  const groups = {};
  for (const p of filtered) {
    if (!groups[p.cat]) groups[p.cat]={};
    if (!groups[p.cat][p.mfr]) groups[p.cat][p.mfr]=[];
    groups[p.cat][p.mfr].push(p);
  }

  const root = document.getElementById("paver-list-root");
  const emptyMsg = document.getElementById("empty-msg");
  const hint = document.getElementById("search-hint");

  if (filtered.length===0) { root.innerHTML=""; emptyMsg.style.display="block"; hint.style.display="none"; return; }
  emptyMsg.style.display="none";
  hint.style.display = q ? "block" : "none";
  hint.textContent = `${filtered.length} result${filtered.length!==1?"s":""} — tap a row to enter values`;

  let html = "";
  for (const [cat, mfrs] of Object.entries(groups)) {
    html += `<div class="cat-label">${cat==="PAVER"?"⬛":"🧱"} ${cat}</div>`;
    for (const [mfr, pavers] of Object.entries(mfrs)) {
      const c = MFR_COLORS[mfr]||{bg:"#333",acc:"#aaa"};
      html += `<div class="mfr-block"><div class="mfr-header" style="background:${c.bg}"><span class="mfr-name" style="color:${c.acc}">${mfr.toUpperCase()}</span></div><div class="paver-list">`;
      for (const p of pavers) html += cardHtml(p);
      html += `</div></div>`;
    }
  }
  root.innerHTML = html;
}

// Partial re-render of a single card (no full re-render needed)
function refreshCard(k) {
  const el = document.querySelector(`.paver-card[data-key="${CSS.escape(k)}"]`);
  if (!el) return;
  const p = paverData.find(p=>key(p)===k);
  if (!p) return;
  const c = MFR_COLORS[p.mfr]||{bg:"#333",acc:"#aaa"};
  const s = state[k]||{};

  let r = null;
  if (s.source==="sf" && s.sf>0) r = sfToOrder(p, s.sf);
  else if (s.source==="order" && (s.pallets>0||s.layers>0)) {
    r = sfToOrder(p, orderToSf(p, s.pallets||0, s.layers||0));
  }

  const isActive = s.sf>0 || s.pallets>0 || s.layers>0;
  el.classList.toggle("active", isActive);

  // Update derived inputs without re-rendering whole card
  const sfInput  = el.querySelector(`[data-field="sf"]`);
  const pltInput = el.querySelector(`[data-field="pallets"]`);
  const lyrInput = el.querySelector(`[data-field="layers"]`);

  if (s.source==="sf" && r) {
    pltInput.value = r.fullPallets > 0 ? r.fullPallets : "";
    lyrInput.value = r.remLayers  > 0 ? r.remLayers  : "";
    pltInput.classList.add("derived"); lyrInput.classList.add("derived");
    sfInput.classList.remove("derived");
  } else if (s.source==="order" && r) {
    const derivedSf = orderToSf(p, s.pallets||0, s.layers||0);
    sfInput.value = derivedSf.toFixed(1);
    sfInput.classList.add("derived");
    pltInput.classList.remove("derived"); lyrInput.classList.remove("derived");
  } else {
    sfInput.classList.remove("derived"); pltInput.classList.remove("derived"); lyrInput.classList.remove("derived");
  }

  el.querySelector(".result-area").innerHTML = resultHtml(p, c, r);
}

// ── Input handler ────────────────────────────────────────────────────────────
document.getElementById("main").addEventListener("input", e => {
  const inp = e.target;
  if (!inp.classList.contains("calc-input")) return;
  const k = inp.dataset.key;
  const field = inp.dataset.field;
  const val = parseFloat(inp.value);
  const num = isNaN(val) || val < 0 ? 0 : val;

  if (!state[k]) state[k] = {source:null, sf:0, pallets:0, layers:0};
  const s = state[k];

  if (field==="sf") {
    s.sf = num; s.source = num>0 ? "sf" : null;
    if (num===0) { s.pallets=0; s.layers=0; }
  } else {
    // pallets or layers — both feed "order" source
    s[field] = num;
    s.source = (s.pallets>0||s.layers>0) ? "order" : null;
    if (!s.source) { s.sf=0; }
  }

  // Update sqftValues for banner (use sfCovered as proxy)
  const p = paverData.find(p=>key(p)===k);
  if (p) {
    let covered = 0;
    if (s.source==="sf" && s.sf>0) { const r=sfToOrder(p,s.sf); covered=r.sfCovered; }
    else if (s.source==="order") covered = orderToSf(p, s.pallets||0, s.layers||0);
    sqftValues[k] = covered;
  }

  refreshCard(k);
  updateBanner();
  updateClearBtn();
});

// ── Banner ───────────────────────────────────────────────────────────────────
function totalPalletsNeeded() {
  let total=0; const lines=[];
  for (const p of paverData) {
    const k=key(p); const s=state[k];
    if (!s||!s.source) continue;
    let r=null;
    if (s.source==="sf"&&s.sf>0) r=sfToOrder(p,s.sf);
    else if (s.source==="order") r=sfToOrder(p,orderToSf(p,s.pallets||0,s.layers||0));
    if (!r) continue;
    total+=r.palletsNeeded;
    lines.push({name:p.name, pallets:r.palletsNeeded});
  }
  return {total, lines};
}

function updateBanner() {
  const {total:totalPallets, lines} = totalPalletsNeeded();
  const banner = document.getElementById("flatbed-banner");
  if (totalPallets===0) { banner.style.display="none"; return; }

  const flatbeds = Math.ceil(totalPallets/FLATBED_MAX);
  const rem = totalPallets % FLATBED_MAX;
  const isLarge = totalPallets >= 10;

  const bannerBg  = totalPallets>=FLATBED_MAX ? "#7f1d1d" : totalPallets>=10 ? "#78350f" : "#14532d";
  const bannerAcc = totalPallets>=FLATBED_MAX ? "#fca5a5" : totalPallets>=10 ? "#fcd34d" : "#86efac";

  banner.style.display="block";
  banner.style.background=bannerBg;
  banner.style.borderColor=bannerAcc;
  document.getElementById("banner-title").style.color=bannerAcc;
  document.getElementById("banner-title").textContent=`${totalPallets} total pallet${totalPallets!==1?"s":""} across all items`;

  const subEl=document.getElementById("banner-sub");
  if (isLarge) {
    subEl.textContent=`${flatbeds} flatbed${flatbeds!==1?"s":""} needed`+(rem>0?` — ${FLATBED_MAX-rem} pallet${FLATBED_MAX-rem!==1?"s":""} of space left on last trailer`:" — trailers fully loaded");
  } else {
    subEl.textContent=`${FLATBED_MAX-totalPallets} more pallet${FLATBED_MAX-totalPallets!==1?"s":""} until a flatbed is needed`;
  }

  document.getElementById("banner-chips").innerHTML = lines.length>1
    ? lines.map(l=>`<span class="banner-chip">${l.name}: ${l.pallets} plt</span>`).join("") : "";

  const vizEl=document.getElementById("flatbed-viz");
  if (totalPallets>=FLATBED_MAX) {
    let vhtml="";
    for (let i=0;i<flatbeds;i++) {
      const isLast=i===flatbeds-1;
      const on=isLast&&rem>0?rem:FLATBED_MAX;
      const pct=Math.round(on/FLATBED_MAX*100);
      vhtml+=`<div class="flatbed-row"><span class="flatbed-lbl">Trailer ${i+1}</span><div class="flatbed-track"><div class="flatbed-fill" style="width:${pct}%;background:${bannerAcc}"></div></div><span class="flatbed-pct" style="color:${bannerAcc}">${on}/${FLATBED_MAX}</span></div>`;
    }
    vizEl.innerHTML=vhtml; vizEl.style.display="flex";
  } else { vizEl.style.display="none"; }
}

function updateClearBtn() {
  const count=Object.values(state).filter(s=>s&&s.source).length;
  const btn=document.getElementById("clear-btn");
  btn.style.display=count>0?"block":"none";
  btn.textContent=`Clear all (${count})`;
}

// ── Controls ─────────────────────────────────────────────────────────────────
document.getElementById("search-input").addEventListener("input",e=>{
  currentSearch=e.target.value;
  document.getElementById("clear-search").style.display=currentSearch?"block":"none";
  render();
});
document.getElementById("clear-search").addEventListener("click",()=>{
  document.getElementById("search-input").value=""; currentSearch="";
  document.getElementById("clear-search").style.display="none"; render();
});
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active"); currentCat=btn.dataset.cat; render();
  });
});
document.getElementById("clear-btn").addEventListener("click",()=>{
  Object.keys(state).forEach(k=>delete state[k]);
  Object.keys(sqftValues).forEach(k=>delete sqftValues[k]);
  currentSearch=""; document.getElementById("search-input").value="";
  document.getElementById("clear-search").style.display="none";
  render(); updateBanner(); updateClearBtn();
});

// PWA install
let deferredPrompt;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("install-bar").style.display="flex";});
document.getElementById("install-btn").addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("install-bar").style.display="none";});
document.getElementById("dismiss-install").addEventListener("click",()=>document.getElementById("install-bar").style.display="none");

if("serviceWorker"in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

render();
</script>
