</head>

      const rid = mkRowId();
      fixedRowIds[pk] = rid;
      state[rid] = {paverKey:pk,source:null,sf:0,pallets:0,layers:0,isExtra:false,parentPaverKey:pk};
    }
  }
}

// ── Calc ──────────────────────────────────────────────────────────────────────
function sfToOrder(p,sf) {
  const totalLayers = Math.ceil(sf/p.sqftLayer);
  const fullPallets = Math.floor(totalLayers/p.layersPallet);
  const remLayers   = totalLayers%p.layersPallet;
  return {totalLayers,fullPallets,remLayers,palletsNeeded:fullPallets+(remLayers>0?1:0),sfCovered:totalLayers*p.sqftLayer};
}
function orderToSf(p,pallets,layers) { return (pallets*p.layersPallet+layers)*p.sqftLayer; }

function getResult(s) {
  const p = getPaver(s.paverKey); if(!p||!s.source) return null;
  if(s.source==='sf'&&s.sf>0) return sfToOrder(p,s.sf);
  if(s.source==='order') { const sf=orderToSf(p,s.pallets||0,s.layers||0); if(sf>0) return sfToOrder(p,sf); }
  return null;
}

// ── HTML builders ─────────────────────────────────────────────────────────────
function resultHtml(s,c) {
  const r=getResult(s);
  if(!r) return `<span class="no-result">Enter square feet, pallets, or layers</span>`;
  const {fullPallets,remLayers,totalLayers,sfCovered,palletsNeeded}=r;
  let h=`<div class="result-wrap">`;
  if(fullPallets>0) h+=`<span class="badge" style="background:${c.bg}">${fullPallets} pallet${fullPallets!==1?'s':''}</span>`;
  if(remLayers>0)   h+=`<span class="badge" style="background:${c.acc}">${remLayers} layer${remLayers!==1?'s':''} extra</span>`;
  if(fullPallets===0&&remLayers===0&&totalLayers>0) h+=`<span class="badge" style="background:${c.bg}">1 pallet</span>`;
  h+=`<div class="result-sub">${totalLayers} total layers &nbsp;·&nbsp; ~${sfCovered.toFixed(1)} SF covered &nbsp;·&nbsp; ${palletsNeeded} pallet${palletsNeeded!==1?'s':''} needed</div></div>`;
  return h;
}

function cardHtml(rowId) {
  const s = state[rowId]; if(!s) return '';
  const p = getPaver(s.paverKey);
  const c = p?(MFR_COLORS[p.mfr]||{bg:'#333',acc:'#aaa'}):{bg:'#333',acc:'#aaa'};

  // Header row: name + add-row button (fixed) OR dropdown + remove (extra)
  let headerHtml='';
  if(!s.isExtra) {
    headerHtml=`<div class="card-header-row">
      <span class="paver-name">${p?p.name:''}</span>
      <button class="add-row-btn" data-addfor="${s.paverKey}" title="Add another quantity for this product">+ Add</button>
    </div>`;
  } else {
    // Extra row: dropdown of same-type pavers filtered by same cat
    const parentP = getPaver(s.parentPaverKey);
    const opts = paverData
      .filter(x=>parentP&&x.cat===parentP.cat&&x.mfr===parentP.mfr)
      .map(x=>{const pk=paverKey(x);return `<option value="${pk}"${s.paverKey===pk?' selected':''}>${x.name}</option>`;}).join('');
    headerHtml=`<div class="card-header-row">
      <span class="paver-name" style="color:#888;font-size:12px;">Additional — ${parentP?parentP.mfr:''}</span>
      <button class="remove-card-btn" data-remove="${rowId}">✕</button>
    </div>
    <select class="paver-select" data-rowid="${rowId}" data-select="paver">
      <option value="">— Select paver —</option>${opts}
    </select>`;
  }

  // Spec pills
  const specHtml = p?`<div class="card-specs">
    <span class="spec-pill">${p.sqftPallet} SF/plt</span>
    <span class="spec-pill">${p.sqftLayer} SF/layer</span>
    <span class="spec-pill">${p.layersPallet} layers/plt</span>
    <span class="spec-pill">${p.piecesLayer} pcs/layer</span>
  </div>`:(!s.isExtra?'':`<div class="card-specs"></div>`);

  // Input derived values
  const r=getResult(s);
  let dispSf=s.sf||'',dispPlt=s.pallets||'',dispLyr=s.layers||'';
  if(r){
    if(s.source==='sf'){dispPlt=r.fullPallets>0?r.fullPallets:'';dispLyr=r.remLayers>0?r.remLayers:'';}
    else if(s.source==='order'&&p) dispSf=orderToSf(p,s.pallets||0,s.layers||0).toFixed(1);
  }
  const sfD=s.source==='order'?' derived':'';
  const pltD=s.source==='sf'?' derived':'';
  const lyrD=s.source==='sf'?' derived':'';
  const dis=(!p)?'disabled':'';

  return `<div class="paver-card${s.source?' active':''}" data-rowid="${rowId}">
    ${headerHtml}${specHtml}
    <div class="inputs-row">
      <div class="input-group">
        <span class="input-lbl">Square Feet</span>
        <input class="calc-input${sfD}" type="number" inputmode="decimal" min="0" placeholder="0" value="${dispSf}" data-rowid="${rowId}" data-field="sf" ${dis}/>
        <span class="input-unit">SF</span>
      </div>
      <span class="inputs-divider">⇄</span>
      <div class="input-group">
        <span class="input-lbl">Pallets</span>
        <input class="calc-input${pltD}" type="number" inputmode="decimal" min="0" placeholder="0" value="${dispPlt}" data-rowid="${rowId}" data-field="pallets" ${dis}/>
        <span class="input-unit">full pallets</span>
      </div>
      <div class="input-group">
        <span class="input-lbl">+ Layers</span>
        <input class="calc-input${lyrD}" type="number" inputmode="decimal" min="0" placeholder="0" value="${dispLyr}" data-rowid="${rowId}" data-field="layers" ${dis}/>
        <span class="input-unit">extra layers</span>
      </div>
    </div>
    <div class="result-area">${resultHtml(s,c)}</div>
  </div>`;
}

// ── Summary panel ─────────────────────────────────────────────────────────────
function updateSummary() {
  // Collect all active rows (fixed + extra), ordered by: active first (in entry order), then inactive
  const activeRows = [];
  // We want to group extras immediately after their parent
  for (const p of paverData) {
    const pk = paverKey(p);
    const rid = fixedRowIds[pk]; if(!rid) continue;
    const s = state[rid];
    if(s&&s.source) activeRows.push(rid);
    for(const erid of (extraRows[pk]||[])) {
      const es=state[erid];
      if(es&&es.source) activeRows.push(erid);
    }
  }

  const section = document.getElementById('summary-section');
  const cards   = document.getElementById('summary-cards');
  if(activeRows.length===0){section.style.display='none';return;}
  section.style.display='block';

  let html='';
  for(const rid of activeRows){
    const s=state[rid]; if(!s) continue;
    const p=getPaver(s.paverKey); if(!p) continue;
    const c=MFR_COLORS[p.mfr]||{bg:'#333',acc:'#aaa'};
    const r=getResult(s); if(!r) continue;
    const {fullPallets,remLayers,palletsNeeded,totalLayers,sfCovered}=r;
    html+=`<div class="summary-row">
      <div class="summary-swatch" style="background:${c.bg}"></div>
      <span class="summary-name"><strong>${p.mfr}</strong> — ${p.name}</span>
      <div class="summary-badges">
        ${fullPallets>0?`<span class="summary-badge" style="background:${c.bg}">${fullPallets} plt</span>`:''}
        ${remLayers>0?`<span class="summary-badge" style="background:${c.acc}">${remLayers} lyr</span>`:''}
        ${fullPallets===0&&remLayers===0?`<span class="summary-badge" style="background:${c.bg}">1 plt</span>`:''}
      </div>
      <span class="summary-detail">${palletsNeeded} plt &nbsp;·&nbsp; ${totalLayers} layers &nbsp;·&nbsp; ~${sfCovered.toFixed(0)} SF</span>
    </div>`;
  }
  cards.innerHTML=html;
}

// ── Full render ───────────────────────────────────────────────────────────────
let currentCat='ALL', currentSearch='';

function render() {
  ensureFixed();
  const q=currentSearch.toLowerCase();
  const filtered=paverData.filter(p=>{
    const catOk=currentCat==='ALL'||p.cat===currentCat;
    const searchOk=!q||p.name.toLowerCase().includes(q)||p.mfr.toLowerCase().includes(q);
    return catOk&&searchOk;
  });
  const groups={};
  for(const p of filtered){
    if(!groups[p.cat])groups[p.cat]={};
    if(!groups[p.cat][p.mfr])groups[p.cat][p.mfr]=[];
    groups[p.cat][p.mfr].push(p);
  }

  const root=document.getElementById('paver-list-root');
  const emptyMsg=document.getElementById('empty-msg');
  const hint=document.getElementById('search-hint');
  if(filtered.length===0){root.innerHTML='';emptyMsg.style.display='block';hint.style.display='none';return;}
  emptyMsg.style.display='none';
  hint.style.display=q?'block':'none';
  hint.textContent=`${filtered.length} result${filtered.length!==1?'s':''} — tap a row to enter values`;

  let html='';
  for(const [cat,mfrs] of Object.entries(groups)){
    html+=`<div class="cat-label">${cat==='PAVER'?'⬛':'🧱'} ${cat}</div>`;
    for(const [mfr,pavers] of Object.entries(mfrs)){
      const c=MFR_COLORS[mfr]||{bg:'#333',acc:'#aaa'};
      html+=`<div class="mfr-block"><div class="mfr-header" style="background:${c.bg}"><span class="mfr-name" style="color:${c.acc}">${mfr.toUpperCase()}</span></div><div class="paver-list">`;
      for(const p of pavers){
        const pk=paverKey(p);
        const rid=fixedRowIds[pk];
        html+=cardHtml(rid);
        for(const erid of (extraRows[pk]||[])) html+=cardHtml(erid);
      }
      html+=`</div></div>`;
    }
  }
  root.innerHTML=html;
}

// ── Partial refresh of one card ───────────────────────────────────────────────
function refreshCard(rowId) {
  const el=document.querySelector(`.paver-card[data-rowid="${rowId}"]`);
  if(!el) return;
  const s=state[rowId]; if(!s) return;
  const p=getPaver(s.paverKey);
  const c=p?(MFR_COLORS[p.mfr]||{bg:'#333',acc:'#aaa'}):{bg:'#333',acc:'#aaa'};
  const r=getResult(s);

  el.classList.toggle('active',!!s.source);

  // Spec pills
  const specEl=el.querySelector('.card-specs');
  if(specEl&&p) specEl.innerHTML=`<span class="spec-pill">${p.sqftPallet} SF/plt</span><span class="spec-pill">${p.sqftLayer} SF/layer</span><span class="spec-pill">${p.layersPallet} layers/plt</span><span class="spec-pill">${p.piecesLayer} pcs/layer</span>`;
  else if(specEl&&!p) specEl.innerHTML='';

  el.querySelectorAll('.calc-input').forEach(i=>i.disabled=!p);

  const sfI=el.querySelector('[data-field="sf"]');
  const pI=el.querySelector('[data-field="pallets"]');
  const lI=el.querySelector('[data-field="layers"]');
  if(sfI&&pI&&lI){
    if(s.source==='sf'&&r){
      pI.value=r.fullPallets>0?r.fullPallets:''; lI.value=r.remLayers>0?r.remLayers:'';
      pI.classList.add('derived'); lI.classList.add('derived'); sfI.classList.remove('derived');
    } else if(s.source==='order'&&r&&p){
      sfI.value=orderToSf(p,s.pallets||0,s.layers||0).toFixed(1);
      sfI.classList.add('derived'); pI.classList.remove('derived'); lI.classList.remove('derived');
    } else {
      sfI.classList.remove('derived'); pI.classList.remove('derived'); lI.classList.remove('derived');
    }
  }
  el.querySelector('.result-area').innerHTML=resultHtml(s,c);
}

// ── Event delegation ──────────────────────────────────────────────────────────
document.getElementById('main').addEventListener('input',e=>{
  if(e.target.dataset.select==='paver'){
    const rid=e.target.dataset.rowid;
    state[rid].paverKey=e.target.value||null;
    state[rid].source=null; state[rid].sf=0; state[rid].pallets=0; state[rid].layers=0;
    refreshCard(rid); updateSummary(); updateBanner(); updateClearBtn(); return;
  }
  if(!e.target.classList.contains('calc-input')) return;
  const rid=e.target.dataset.rowid, field=e.target.dataset.field;
  const num=Math.max(0,parseFloat(e.target.value)||0);
  const s=state[rid];
  if(field==='sf'){ s.sf=num; s.source=num>0?'sf':null; if(!s.source){s.pallets=0;s.layers=0;} }
  else { s[field]=num; s.source=(s.pallets>0||s.layers>0)?'order':null; if(!s.source)s.sf=0; }
  refreshCard(rid); updateSummary(); updateBanner(); updateClearBtn();
});

document.getElementById('main').addEventListener('click',e=>{
  // Add extra row
  const addBtn=e.target.closest('.add-row-btn');
  if(addBtn){
    const parentPk=addBtn.dataset.addfor;
    const parentP=getPaver(parentPk); if(!parentP) return;
    const rid=mkRowId();
    state[rid]={paverKey:null,source:null,sf:0,pallets:0,layers:0,isExtra:true,parentPaverKey:parentPk};
    if(!extraRows[parentPk]) extraRows[parentPk]=[];
    extraRows[parentPk].push(rid);
    // Insert after last card associated with this parent
    const parentRid=fixedRowIds[parentPk];
    const allRids=[parentRid,...(extraRows[parentPk].slice(0,-1))];
    let lastEl=null;
    for(const r of allRids){ const el=document.querySelector(`.paver-card[data-rowid="${r}"]`); if(el) lastEl=el; }
    const div=document.createElement('div');
    div.innerHTML=cardHtml(rid);
    const newCard=div.firstChild;
    if(lastEl) lastEl.after(newCard);
    return;
  }
  // Remove extra row
  const removeBtn=e.target.closest('.remove-card-btn');
  if(removeBtn){
    const rid=removeBtn.dataset.remove;
    for(const pk of Object.keys(extraRows)) extraRows[pk]=extraRows[pk].filter(r=>r!==rid);
    delete state[rid];
    document.querySelector(`.paver-card[data-rowid="${rid}"]`)?.remove();
    updateSummary(); updateBanner(); updateClearBtn();
  }
});

// ── Banner ────────────────────────────────────────────────────────────────────
function updateBanner(){
  let total=0; const lines=[];
  for(const [rid,s] of Object.entries(state)){
    if(!s||!s.source||!s.paverKey) continue;
    const r=getResult(s); if(!r) continue;
    const p=getPaver(s.paverKey);
    total+=r.palletsNeeded;
    lines.push({name:p?p.name:'?',pallets:r.palletsNeeded});
  }
  const banner=document.getElementById('flatbed-banner');
  if(total===0){banner.style.display='none';return;}
  const flatbeds=Math.ceil(total/FLATBED_MAX), rem=total%FLATBED_MAX, isLarge=total>=12;
  const bg=total>=FLATBED_MAX?'#7f1d1d':total>=12?'#78350f':'#14532d';
  const ac=total>=FLATBED_MAX?'#fca5a5':total>=12?'#fcd34d':'#86efac';
  banner.style.display='block'; banner.style.background=bg; banner.style.borderColor=ac;
  document.getElementById('banner-title').style.color=ac;
  document.getElementById('banner-title').textContent=`${total} total pallet${total!==1?'s':''} across all items`;
  const sub=document.getElementById('banner-sub');
  sub.textContent=isLarge
    ?`${flatbeds} flatbed${flatbeds!==1?'s':''} needed`+(rem>0?` — ${FLATBED_MAX-rem} pallet${FLATBED_MAX-rem!==1?'s':''} of space left on last trailer`:' — trailers fully loaded')
    :`${FLATBED_MAX-total} more pallet${FLATBED_MAX-total!==1?'s':''} until a flatbed is needed`;
  document.getElementById('banner-chips').innerHTML=lines.length>1?lines.map(l=>`<span class="banner-chip">${l.name}: ${l.pallets} plt</span>`).join(''):'';
  const viz=document.getElementById('flatbed-viz');
  if(total>=FLATBED_MAX){
    viz.innerHTML=Array.from({length:flatbeds},(_,i)=>{
      const on=i===flatbeds-1&&rem>0?rem:FLATBED_MAX;
      const pct=Math.round(on/FLATBED_MAX*100);
      return `<div class="flatbed-row"><span class="flatbed-lbl">Trailer ${i+1}</span><div class="flatbed-track"><div class="flatbed-fill" style="width:${pct}%;background:${ac}"></div></div><span class="flatbed-pct" style="color:${ac}">${on}/${FLATBED_MAX}</span></div>`;
    }).join('');
    viz.style.display='flex';
  } else viz.style.display='none';
}

function updateClearBtn(){
  const count=Object.values(state).filter(s=>s&&s.source).length;
  const btn=document.getElementById('clear-btn');
  btn.style.display=count>0?'block':'none';
  btn.textContent=`Clear all (${count})`;
}

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input',e=>{
  currentSearch=e.target.value;
  document.getElementById('clear-search').style.display=currentSearch?'block':'none';
  render();
});
document.getElementById('clear-search').addEventListener('click',()=>{
  document.getElementById('search-input').value=''; currentSearch='';
  document.getElementById('clear-search').style.display='none'; render();
});
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); currentCat=btn.dataset.cat; render();
}));
document.getElementById('clear-btn').addEventListener('click',()=>{
  Object.keys(state).forEach(k=>{if(state[k]){state[k].source=null;state[k].sf=0;state[k].pallets=0;state[k].layers=0;}});
  Object.keys(extraRows).forEach(k=>extraRows[k]=[]);
  currentSearch=''; document.getElementById('search-input').value='';
  document.getElementById('clear-search').style.display='none';
  render(); updateSummary(); updateBanner(); updateClearBtn();
});

// PWA
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install-bar').style.display='flex';});
document.getElementById('install-btn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install-bar').style.display='none';});
document.getElementById('dismiss-install').addEventListener('click',()=>document.getElementById('install-bar').style.display='none');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
</script>

</html>
